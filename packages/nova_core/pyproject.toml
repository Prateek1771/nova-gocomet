[project]
name = "nova-core"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "temporalio>=1.9",
  "pyjwt[crypto]>=2.10",
  "structlog>=24.4",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "opentelemetry-instrumentation-asyncpg>=0.66b1",
  "minio>=7.2.20",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
