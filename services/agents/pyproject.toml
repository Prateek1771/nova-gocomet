[project]
name = "nova-agents"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "nova-core", "nova-dsl", "temporalio>=1.9", "httpx>=0.27", "jsonschema>=4.23",
  "pdfplumber>=0.11", "pypdfium2>=4.30", "pillow>=11", "rapidfuzz>=3.10", "langgraph>=0.2",
]

[tool.uv.sources]
nova-core = { workspace = true }
nova-dsl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
