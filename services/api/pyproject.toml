[project]
name = "nova-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "nova-core",
    "nova-dsl",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "alembic>=1.14",
    "httpx>=0.27",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "python-multipart>=0.0.32",
    "jsonschema>=4.26.0",
    "pypdfium2>=5.14.0",
]

[tool.uv.sources]
nova-core = { workspace = true }
nova-dsl = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
