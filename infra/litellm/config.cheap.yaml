# LLM_MODE=cheap (dev default, ADR-022): cheap OpenRouter models, Jev for decide, host Ollama for the
# decide fallback + embeddings. ~$0.0005 per BoL. Code only names the aliases (CLAUDE.md rule 6).
# nova-decide -> nova-decide-fallback is done in code (nova_agents.decide), so no router fallback here.
model_list:
  # scans: LandingAI DPT-2 Parse + Extract via the custom provider in ade_handler.py (ADR-034).
  # completion_tokens = ADE credits x 1000, priced so the gateway books $0.01 per credit on the tenant key.
  - model_name: nova-extract-scan
    litellm_params: {model: ade/dpt-2-20260903, api_key: os.environ/DPT_LANDING_API_KEY, api_base: https://api.va.landing.ai, num_retries: 0, timeout: 240}
    model_info: {input_cost_per_token: 0, output_cost_per_token: 0.00001}
  - model_name: nova-extract-text
    litellm_params: {model: openrouter/google/gemini-2.5-flash-lite, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: nova-extract-vision
    litellm_params: {model: openrouter/google/gemini-2.5-flash-lite, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: nova-reason
    litellm_params: {model: openrouter/google/gemini-2.5-flash-lite, api_key: os.environ/OPENROUTER_API_KEY}
  # nova-decide is the chat fallback behind Jev's decisions API (nova_agents.decide); jev-router is a
  # reasoning router (~10 s, $0.0025/call), so a fast cheap chat model takes this slot
  - model_name: nova-decide
    litellm_params: {model: openrouter/google/gemini-2.5-flash-lite, api_key: os.environ/OPENROUTER_API_KEY}
  - model_name: nova-decide-fallback
    litellm_params: {model: ollama_chat/gemma3:4b, api_base: http://host.docker.internal:11434}
  - model_name: nova-embed
    litellm_params: {model: ollama/nomic-embed-text, api_base: http://host.docker.internal:11434}
litellm_settings:
  custom_provider_map:
    - {provider: ade, custom_handler: ade_handler.ade}
  drop_params: true             # providers ignore params they lack (e.g. response_format on ollama)
  cache: true
  cache_params: {type: redis, host: redis, port: 6379, ttl: 604800}   # 7 days: rehearsals are free
  max_budget: 10                # USD, global hard cap for dev (per-tenant virtual keys arrive in M4)
  budget_duration: 30d
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Jev's decisions API isn't chat/completions; the gateway forwards it so the key and egress stay here
  pass_through_endpoints:
    - path: /jev/decisions
      target: https://openrouter.ai/api/alpha/decisions
      headers:
        Authorization: bearer os.environ/OPENROUTER_API_KEY
        content-type: application/json
