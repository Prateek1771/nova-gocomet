# LLM_MODE=free (dev default, ADR-025): $0 models only. Groq free tier first, OpenRouter `:free` behind it
# on 429/errors. Free tiers are rate-limited (Groq: 30 RPM, 1K RPD per model) and free OpenRouter
# providers may log prompts: synthetic demo documents only. Paid paths stay in config.cheap/demo.yaml.
# Ids checked 2026-10-09 (`:free` ids churn; re-list with scripts in ADR-025 when one 404s).
# Jev (decisions API) is paid, so there's no pass-through here and nova_agents.decide skips it.
# Groq free plan never bills (over the limit it 429s), so zero its price; drop these if the org upgrades
x-groq: &groq {api_key: os.environ/GROQ_API_KEY, rpm: 30, input_cost_per_token: 0, output_cost_per_token: 0}
x-or: &or {api_key: os.environ/OPENROUTER_API_KEY}
model_list:
  - model_name: nova-extract-text
    litellm_params: {<<: *groq, model: groq/openai/gpt-oss-120b, reasoning_effort: low}
  - model_name: nova-reason
    litellm_params: {<<: *groq, model: groq/openai/gpt-oss-120b, reasoning_effort: low}
  - model_name: nova-decide
    litellm_params: {<<: *groq, model: groq/openai/gpt-oss-20b, reasoning_effort: low}
  - model_name: nova-decide-fallback
    litellm_params: {<<: *groq, model: groq/qwen/qwen3.8-27b}
  # no free Groq model takes images; scanned pages go straight to OpenRouter
  - model_name: nova-extract-vision
    litellm_params: {<<: *or, model: openrouter/google/gemma-4-31b-it:free}
  - model_name: nova-embed
    litellm_params: {model: ollama/nomic-embed-text, api_base: http://host.docker.internal:11434}
  # fallback deployments (never named by code)
  - model_name: free-text
    litellm_params: {<<: *or, model: openrouter/nvidia/nemotron-3-super-120b-a12b:free}
  - model_name: free-vision
    litellm_params: {<<: *or, model: openrouter/google/gemma-4-26b-a4b-it:free}
  - model_name: free-any       # OpenRouter's own router over whatever free model is up
    litellm_params: {<<: *or, model: openrouter/openrouter/free}
litellm_settings:
  drop_params: true
  num_retries: 2
  fallbacks:
    - nova-extract-text: [free-text, free-any]
    - nova-reason: [free-text, free-any]
    - nova-decide: [free-text, free-any]
    - nova-decide-fallback: [free-any]
    - nova-extract-vision: [free-vision, free-any]
  cache: true
  cache_params: {type: redis, host: redis, port: 6379, ttl: 604800}   # 7 days: stretches the daily caps
  max_budget: 1                 # USD guard: free models cost $0, so this only trips if a paid one slips in
  budget_duration: 30d
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
