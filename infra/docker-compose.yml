# Nova local stack. `core` = what runs today (M2: + minio, litellm, agents); openfga (M4) and the ai
# profile (langfuse, weaviate) join as their milestones land. `data` = M1 spike (Kafka + Debezium + ClickHouse). Host ports avoid the usual 3000/5432/8080 clashes.
name: nova

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://nova_app:nova_app@postgres:5432/nova
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://nova_owner:nova_owner@postgres:5432/nova
  KEYCLOAK_ISSUER: http://localhost:8180/realms/nova
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/nova/protocol/openid-connect/certs
  TEMPORAL_HOST: temporal:7233
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  OTEL_METRICS_EXPORTER: none  # Jaeger takes traces only; metrics join with the M4 collector
  OTEL_LOGS_EXPORTER: none
  S3_ENDPOINT: minio:9000
  LLM_BASE_URL: http://litellm:4000
  ENV: dev

services:
  postgres:
    image: postgres:17-alpine
    profiles: [core]
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium CDC (data profile)
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # sessions only; a restart = re-login
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # browser-facing issuer; containers reach the same realm at keycloak:8080 (backchannel)
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      start_period: 120s
      retries: 30

  temporal:
    # ponytail: dev server (SQLite file) instead of auto-setup + Postgres schema jobs; one container,
    # durable across restarts. Move to the Postgres-backed server if load or HA ever matter.
    image: temporalio/temporal:1.5.1
    profiles: [core]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes:
      - temporaldata:/home/temporal  # existing dir owned by the image user (uid 1000)
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      retries: 30

  jaeger:
    # ponytail: Jaeger all-in-one (in-memory) as the dev trace UI on :16686. The OTel collector and
    # Langfuse arrive with the ai profile in M4; services keep speaking plain OTLP either way.
    image: jaegertracing/jaeger:2.11.0
    profiles: [core]
    ports: ["127.0.0.1:16686:16686"]

  minio:
    # chainguard build: MinIO stopped publishing community images in 2025. Bucket is created lazily
    # by nova_core.storage, so no init container.
    image: cgr.dev/chainguard/minio:latest
    profiles: [core]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nova
      MINIO_ROOT_PASSWORD: nova-dev-secret
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: [miniodata:/data]

  litellm:
    # one gateway for every model call; LLM_MODE (from ../.env) picks config.<mode>.yaml (ADR-014)
    image: ghcr.io/berriai/litellm:main-stable
    profiles: [core]
    # ../.env carries the app's DATABASE_URL; LiteLLM gets its own DB (spend, budgets, admin UI)
    entrypoint: ["sh", "-c", "export DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm; exec litellm --config /configs/config.$${LLM_MODE:-cheap}.yaml --port 4000"]
    env_file:
      - path: ../.env
        required: false
    environment:
      LITELLM_MASTER_KEY: sk-nova-dev
      UI_USERNAME: admin          # dev-only admin UI login at http://localhost:4100/ui
      UI_PASSWORD: nova-dev-admin
    volumes: ["./litellm:/configs:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # host Ollama (decide fallback, embeddings)
    ports: ["127.0.0.1:4100:4000"]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  migrate:
    image: nova-api:dev
    build: { context: .., dockerfile: services/api/Dockerfile }
    profiles: [core]
    command: ["sh", "-c", "alembic upgrade head && python -m nova_api.seed"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: nova-api:dev
    profiles: [core]
    environment: *api-env
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      minio: { condition: service_started }

  engine:
    image: nova-engine:dev
    build: { context: .., dockerfile: services/engine/Dockerfile }
    profiles: [core]
    environment: *api-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }

  agents:
    image: nova-agents:dev
    build: { context: .., dockerfile: services/agents/Dockerfile }
    profiles: [core]
    environment:
      <<: *api-env
      LLM_API_KEY: sk-nova-dev
      LLM_MODE: ${LLM_MODE:-cheap}
      JEV_MODEL: typesafe/jev-1.13  # decisions model behind the gateway's /jev/decisions
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      temporal: { condition: service_healthy }
      litellm: { condition: service_started }
      minio: { condition: service_started }

  web:
    image: nova-web:dev
    build: { context: .., dockerfile: apps/web/Dockerfile }
    profiles: [core]
    environment:
      APP_URL: http://localhost:3300
      KEYCLOAK_ISSUER: http://localhost:8180/realms/nova
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/nova
      OIDC_CLIENT_ID: nova-web
      OIDC_CLIENT_SECRET: nova-web-dev-secret
      NOVA_API_URL: http://api:8000
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3300:3000"]
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  # --- data profile (M1 spike; M6 builds on it). Run with: --profile core --profile data ---
  kafka:
    image: apache/kafka:3.9.1
    profiles: [data]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.0
    profiles: [data]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: nova-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    profiles: [data]
    environment:
      CLICKHOUSE_USER: nova
      CLICKHOUSE_PASSWORD: nova
    ports: ["127.0.0.1:8124:8123"]  # 8123 is often taken (Langfuse ClickHouse)
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "nova", "--password", "nova", "-q", "select 1"]
      interval: 10s
      retries: 20

volumes:
  miniodata:
  pgdata:
  temporaldata:
  chdata:
