# Nova local stack. `core` = what M0 runs; temporal (M1), minio (M2), openfga (M4) and the
# data / ai profiles join as their milestones land. Host ports avoid the usual 3000/5432/8080 clashes.
name: nova

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://nova_app:nova_app@postgres:5432/nova
  MIGRATIONS_DATABASE_URL: postgresql+asyncpg://nova_owner:nova_owner@postgres:5432/nova
  KEYCLOAK_ISSUER: http://localhost:8180/realms/nova
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/nova/protocol/openid-connect/certs
  ENV: dev

services:
  postgres:
    image: postgres:17-alpine
    profiles: [core]
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    profiles: [core]
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # sessions only; a restart = re-login
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    profiles: [core]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # browser-facing issuer; containers reach the same realm at keycloak:8080 (backchannel)
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      start_period: 120s
      retries: 30

  migrate:
    image: nova-api:dev
    build: { context: .., dockerfile: services/api/Dockerfile }
    profiles: [core]
    command: ["sh", "-c", "alembic upgrade head && python -m nova_api.seed"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    image: nova-api:dev
    profiles: [core]
    environment: *api-env
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    image: nova-web:dev
    build: { context: .., dockerfile: apps/web/Dockerfile }
    profiles: [core]
    environment:
      APP_URL: http://localhost:3300
      KEYCLOAK_ISSUER: http://localhost:8180/realms/nova
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/nova
      OIDC_CLIENT_ID: nova-web
      OIDC_CLIENT_SECRET: nova-web-dev-secret
      NOVA_API_URL: http://api:8000
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3300:3000"]
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }

volumes:
  pgdata:
