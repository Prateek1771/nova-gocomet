# docs/10 Phase 2 — M0 + M1 jobs. Later milestones add definitions, contracts, workflow-tests, ai-recorded.
# ponytail: actions pinned to major tags for now; Renovate (Phase 2 task) pins them to SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      python: ${{ steps.f.outputs.python }}
      web: ${{ steps.f.outputs.web }}
      infra: ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            python: ['packages/**', 'services/**', 'tests/**', 'pyproject.toml', 'uv.lock']
            web: ['apps/web/**', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/nova_dsl/schema/**', 'services/api/openapi.json']
            infra: ['infra/**', '**/Dockerfile', '.github/workflows/**']

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest tests/unit --junitxml=junit-unit.xml
      # Temporal time-skipping tests; 100% branch coverage gate on the interpreter + handlers
      - run: uv run coverage run -m pytest tests/engine --junitxml=junit-engine.xml && uv run coverage report
      - name: Generated schemas are committed (DSL JSON Schema, OpenAPI)
        run: |
          uv run python -m nova_dsl.schema && uv run python -m nova_api.openapi
          git diff --exit-code -- packages/nova_dsl/schema services/api/openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-unit, path: "junit-*.xml" }

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web test
      - name: TS types match the DSL schema and OpenAPI
        run: pnpm -C apps/web gen && git diff --exit-code -- apps/web/src/dsl apps/web/src/lib/api-types.ts
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm -C apps/web build

  integration:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - name: OpenFGA model validates
        run: docker run --rm -v "$PWD/infra/openfga:/m:ro" openfga/cli model validate --file /m/model.fga | tee /dev/stderr | grep -q '"is_valid":true'
      # testcontainers Postgres (RLS, engine + API on Temporal's test server) + Keycloak (realm, tokens)
      - run: uv run pytest tests/integration --junitxml=junit-int.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-integration, path: junit-int.xml }

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
      - uses: aquasecurity/trivy-action@0.33.1
        with: { scan-type: fs, scanners: "vuln,misconfig", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: astral-sh/setup-uv@v6
      - run: uv export --frozen --no-dev --no-emit-workspace -o /tmp/req.txt && uvx pip-audit -r /tmp/req.txt
      - uses: pnpm/action-setup@v4
      - run: pnpm audit --prod --audit-level high

  images:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: services/api/Dockerfile }
          - { name: engine, dockerfile: services/engine/Dockerfile }
          - { name: agents, dockerfile: services/agents/Dockerfile }
          - { name: web, dockerfile: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: nova-${{ matrix.name }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@0.33.1
        with: { image-ref: "nova-${{ matrix.name }}:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1" }
      - uses: anchore/sbom-action@v0
        with: { image: "nova-${{ matrix.name }}:ci", format: spdx-json, artifact-name: "sbom-${{ matrix.name }}.spdx.json" }
