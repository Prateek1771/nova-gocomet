[project]
name = "nova"
version = "0.0.0"
requires-python = ">=3.13,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
nova-core = { workspace = true }
nova-dsl = { workspace = true }
nova-api = { workspace = true }
nova-engine = { workspace = true }
nova-agents = { workspace = true }
nova-ingest = { workspace = true }

[dependency-groups]
dev = [
  "nova-core", "nova-dsl", "nova-api", "nova-engine", "nova-agents", "nova-ingest", "reportlab>=4.2", "hypothesis>=6.115", "types-pyyaml", "types-jsonschema", "coverage>=7.6",
  "ruff>=0.7", "mypy>=1.13", "pytest>=8", "pytest-asyncio>=0.24",
  "import-linter>=2.1", "testcontainers[postgres,keycloak]>=4.8", "cryptography>=43",
  "pip-audit>=2.7",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["nova_core", "nova_dsl", "nova_api", "nova_engine", "nova_agents"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"scripts/**" = ["S107", "S603", "S607", "S608"]  # dev tools: local subprocess + constant SQL
"services/api/src/nova_api/migrations/**" = ["E501"]

[tool.mypy]
strict = true
packages = ["nova_core", "nova_dsl", "nova_api", "nova_engine", "nova_agents"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "celpy.*", "lark.*", "pdfplumber.*", "pypdfium2.*", "reportlab.*", "minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]

[tool.coverage.run]
branch = true
source = ["services/engine/src/nova_engine"]

[tool.coverage.report]
include = ["*/nova_engine/interpreter.py", "*/nova_engine/handlers.py"]
fail_under = 100
show_missing = true

[tool.importlinter]
root_packages = ["nova_core", "nova_dsl", "nova_api", "nova_engine", "nova_agents", "nova_ingest"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "packages never import services"
type = "forbidden"
source_modules = ["nova_core", "nova_dsl"]
forbidden_modules = ["nova_api", "nova_engine", "nova_agents", "nova_ingest"]

[[tool.importlinter.contracts]]
name = "services never import each other"
type = "independence"
modules = ["nova_api", "nova_engine", "nova_agents", "nova_ingest"]

[[tool.importlinter.contracts]]
name = "nova_dsl has no I/O"
type = "forbidden"
source_modules = ["nova_dsl"]
forbidden_modules = ["nova_core", "sqlalchemy", "httpx", "asyncpg", "temporalio"]
allow_indirect_imports = true
